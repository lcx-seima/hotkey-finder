name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  APP_NAME: Hotkey Finder
  APP_BUNDLE_ID: com.lcxseima.HotkeyFinder
  DERIVED_DATA_PATH: build/DerivedData
  RELEASE_ZIP: dist/Hotkey-Finder.zip

jobs:
  release:
    name: Build and publish app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          build_settings="$(xcodebuild \
            -project HotkeyFinder.xcodeproj \
            -scheme HotkeyFinder \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings)"
          project_version="$(awk -F ' = ' \
            '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }' \
            <<< "$build_settings")"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "::error::Tag version $tag_version does not match MARKETING_VERSION $project_version."
            exit 1
          fi

      - name: Build universal app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HotkeyFinder.xcodeproj \
            -scheme HotkeyFinder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='arm64 x86_64' \
            build

      - name: Ad-hoc sign app bundle
        shell: bash
        run: |
          set -euo pipefail

          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"

          test -d "$app_path"
          codesign \
            --force \
            --sign - \
            --identifier "$APP_BUNDLE_ID" \
            --options runtime \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          signature_info="$(codesign --display --verbose=2 "$app_path" 2>&1)"
          actual_identifier="$(awk -F= '/^Identifier=/ { print $2; exit }' <<< "$signature_info")"
          if [[ "$actual_identifier" != "$APP_BUNDLE_ID" ]]; then
            echo "::error::Expected signing identifier $APP_BUNDLE_ID, found $actual_identifier."
            exit 1
          fi

          designated_requirement="$(codesign --display --requirements - "$app_path" 2>&1)"
          if [[ "$designated_requirement" != *'designated =>'* ]]; then
            echo "::error::The signed app does not have a designated requirement."
            exit 1
          fi

      - name: Verify and package release asset
        shell: bash
        run: |
          set -euo pipefail

          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          executable_path="$app_path/Contents/MacOS/$APP_NAME"

          architectures="$(lipo -archs "$executable_path")"
          if [[ "$architectures" != *arm64* || "$architectures" != *x86_64* ]]; then
            echo "::error::Expected a universal app, found architectures: $architectures"
            exit 1
          fi

          mkdir -p "$(dirname "$RELEASE_ZIP")"
          (
            cd "$(dirname "$app_path")"
            zip -qry --symlinks "$GITHUB_WORKSPACE/$RELEASE_ZIP" "$(basename "$app_path")"
          )
          (
            cd "$(dirname "$RELEASE_ZIP")"
            shasum -a 256 "$(basename "$RELEASE_ZIP")" > "$(basename "$RELEASE_ZIP").sha256"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ZIP#Unsigned universal macOS app" \
            "$RELEASE_ZIP.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "Hotkey Finder $GITHUB_REF_NAME" \
            --notes 'This automated build is ad-hoc signed, but it is not signed with an Apple Developer ID or notarized. Read the installation notice in the README before opening it.' \
            --generate-notes \
            --latest

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          printf 'Released [%s](%s)\n' "$GITHUB_REF_NAME" "$release_url" >> "$GITHUB_STEP_SUMMARY"
